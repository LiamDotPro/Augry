# Builds Augry for Windows, macOS and Linux and publishes a GitHub
# Release with the installers attached.
#
# Trigger by pushing an annotated tag that matches the version in package.json,
# src-tauri/Cargo.toml and src-tauri/tauri.conf.json:
#
#   git tag -a v0.3.0 -m "What changed, a few short lines"
#   git push origin v0.3.0
#
# The tag message becomes the top of the release notes. The release is created
# as a draft, every platform uploads into it, and it is published only once all
# of them have succeeded, so a public release never has missing downloads.
#
# "Run workflow" from the Actions tab builds every platform without releasing;
# the bundles are kept as workflow artifacts.
#
# The macOS app is signed with a Developer ID certificate and notarized by Apple
# when the APPLE_* repository secrets are set (docs/macos-signing.md lists
# them). Without them it is built unsigned and the release notes say how to get
# past Gatekeeper.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      # actions/checkout turns the tag into a lightweight one; fetch it again to
      # get the annotation.
      - name: Read the tag message
        env:
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          if [ ! -s notes.md ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          fi
          cat >> notes.md <<'EOF'

          ## Downloads

          | Platform | File |
          |---|---|
          | Windows 10 1809+ | `*_x64-setup.exe` (per user, no admin, recommended) or `*_x64_en-US.msi` |
          | macOS (Apple Silicon and Intel) | `*_universal.dmg` |
          | Linux x64 | `*_amd64.AppImage`, `*_amd64.deb` or `*.x86_64.rpm` |
          EOF
          if [ "$MAC_SIGNED" != "true" ]; then
            cat >> notes.md <<'EOF'

          The macOS build is not notarized. If macOS says the app is damaged,
          run `xattr -cr "/Applications/Augry.app"` once after installing.
          EOF
          fi
          cat notes.md

      - name: Create or reuse the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Augry ${GITHUB_REF_NAME}" \
              -F body=@notes.md \
              -F draft=true \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    # Also runs on a manual dispatch, where the draft job is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rust-targets: ""
            args: ""
          - name: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: linux
            # The oldest supported runner, so the AppImage runs on older glibc.
            os: ubuntu-22.04
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Core tests
        run: cargo test
        working-directory: src-tauri

      # The Tauri bundler imports APPLE_CERTIFICATE into a temporary keychain,
      # signs with hardened runtime, notarizes and staples. It treats a variable
      # that is set but empty as configured, so only export the ones that hold
      # a value. Notarization uses an App Store Connect API key if there is
      # one, otherwise an Apple ID with an app-specific password.
      - name: macOS signing credentials
        if: matrix.name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set, so the macOS app is unsigned and Gatekeeper will block it."
            exit 0
          fi

          export_var() {
            # Heredoc form so a value with newlines cannot break GITHUB_ENV.
            { echo "$1<<APPLE_ENV_EOF"; printf '%s\n' "$2"; echo "APPLE_ENV_EOF"; } >> "$GITHUB_ENV"
          }

          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is not."
            exit 1
          fi
          export_var APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          export_var APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            export_var APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          fi

          # A signed but un-notarized app is still blocked by Gatekeeper, so a
          # certificate without notarization credentials is a configuration
          # mistake rather than something to ship.
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
            export_var APPLE_API_KEY "$APPLE_API_KEY"
            export_var APPLE_API_ISSUER "$APPLE_API_ISSUER"
            export_var APPLE_API_KEY_PATH "$key_path"
            echo "Signing, and notarizing with App Store Connect API key $APPLE_API_KEY."
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export_var APPLE_ID "$APPLE_ID"
            export_var APPLE_PASSWORD "$APPLE_PASSWORD"
            export_var APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "Signing, and notarizing with Apple ID."
          else
            echo "::error::APPLE_CERTIFICATE is set but notarization credentials are not. Set APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY, or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID."
            exit 1
          fi
          echo "MAC_SIGNED=true" >> "$GITHUB_ENV"

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          # Empty on a manual run, so the action only builds.
          releaseId: ${{ needs.draft.outputs.release_id }}
          uploadWorkflowArtifacts: true

      # Fails the build rather than publishing an app Gatekeeper would reject.
      - name: Verify the macOS signature and notarization
        if: matrix.name == 'macos' && env.MAC_SIGNED == 'true'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Augry.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Package unsigned MSIX for the Microsoft Store
        if: matrix.name == 'windows'
        shell: pwsh
        run: .\scripts\pack-msix.ps1

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: msix-unsigned
          path: src-tauri/target/msix/*.msix
          if-no-files-found: error

  publish:
    needs: [draft, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ needs.draft.outputs.release_id }}" \
            -F draft=false -f make_latest=true --jq .html_url
