# Tests and type checks on every push to main and every pull request, on all
# three platforms the app ships for. Releases are built by release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Type check and build the frontend
        run: npm run build

      - name: Format check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy (trigger crates)
        run: cargo clippy -p trigger-core -p trigger-hub -p trigger-fs --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Core tests
        run: cargo test --workspace
        working-directory: src-tauri

      - name: Trigger crate rules
        run: node plans/_tools/check-crates.mjs

      - name: Inotify limits (Linux, for the log)
        if: runner.os == 'Linux'
        run: cat /proc/sys/fs/inotify/max_user_watches /proc/sys/fs/inotify/max_user_instances

      - name: Live file watching tests
        run: cargo test -p trigger-fs -- --ignored --test-threads=1
        working-directory: src-tauri
        timeout-minutes: 10
