<!doctype html>
<!--
  Augry master icon (App Shell.dc.html board 04, Components.dc.html
  use="appicon"). A 1024x1024 artboard: three glass panes, violet at the back,
  cyan in the middle and clear glass in front, skewed on a plain dark tile.
  Nothing else: no glow, floor or reflection. Add ?small for the flat version
  used at 48px and below, where the glass turns to solid colours so the mark
  stays clear. See README.md for rendering.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  * { box-sizing: border-box; }
  .art { position: relative; width: 1024px; height: 1024px; overflow: hidden; }
  .tile {
    position: absolute; inset: 0; border-radius: 230px; overflow: hidden;
    background: linear-gradient(180deg, #16133a, #06050f);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.07), inset 0 6px 0 rgba(255,255,255,.08);
  }
  .pane { position: absolute; transform: skewY(-10deg); }

  .full .pane { width: 300px; height: 440px; border-radius: 46px; border: 5px solid; }
  .full .back { left: 452px; top: 268px; background: linear-gradient(160deg, rgba(139,108,255,.92), rgba(139,108,255,.4)); border-color: rgba(206,190,255,.85); }
  .full .mid { left: 362px; top: 302px; background: linear-gradient(160deg, rgba(63,200,255,.86), rgba(63,200,255,.32)); border-color: rgba(150,230,255,.9); }
  .full .front { left: 272px; top: 336px; background: linear-gradient(155deg, rgba(255,255,255,.55), rgba(255,255,255,.14) 45%, rgba(141,220,255,.32)); border-color: rgba(255,255,255,.85); box-shadow: inset 10px 0 0 rgba(240,252,255,.95); }

  .small .pane { width: 320px; height: 470px; border-radius: 56px; }
  .small .back { left: 452px; top: 250px; background: #8b6cff; }
  .small .mid { left: 352px; top: 290px; background: #3fc8ff; }
  .small .front { left: 252px; top: 330px; background: #f2fbff; }
</style>
</head>
<body>
<div class="art">
  <div class="tile" id="tile">
    <div class="pane back"></div>
    <div class="pane mid"></div>
    <div class="pane front"></div>
  </div>
</div>
<script>
  document.getElementById("tile").classList.add(location.search.includes("small") ? "small" : "full");
</script>
</body>
</html>
