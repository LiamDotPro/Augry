[package]
name = "terminal-grid"
version = "0.5.0"
description = "Terminal grid with git labels, worktree view and markdown notes"
edition = "2021"

[lib]
name = "terminal_grid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
sysinfo = "0.39"
trash = "5"
notify = "8"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
# Augry cloud (src/cloud): the HTTP client, and the session token in the OS keychain.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The 2.4 line still works with tauri 2.11, which @tauri-apps/api matches.
tauri-plugin-deep-link = "~2.4"

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["sync-secret-service", "crypto-rust"]

# A second launch from an augry:// link hands the link to the running app.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "~2.4", features = ["deep-link"] }

# Native window glass for the Glass theme (src/glass.rs), and the full screen
# traffic lights (src/traffic_lights.rs).
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
