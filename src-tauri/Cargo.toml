[package]
name = "terminal-grid"
version = "0.5.0"
description = "Terminal grid with git labels, worktree view and markdown notes"
edition = "2021"

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8.2"
uuid = { version = "1", features = ["v4"] }
globset = "0.4.20"
regex = "1.13"
croner = "4.0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
calcard = { version = "0.3.14", default-features = false }
ureq = "3.4"
iana-time-zone = "0.1.65"

[lib]
name = "terminal_grid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["trigger-fs", "trigger-git", "trigger-clock", "trigger-docker", "trigger-github"]
trigger-fs = ["dep:trigger-fs"]
trigger-git = ["dep:trigger-git"]
trigger-clock = ["dep:trigger-clock"]
trigger-docker = ["dep:trigger-docker"]
trigger-github = ["dep:trigger-github"]

[dependencies]
trigger-core = { path = "crates/trigger-core" }
trigger-hub = { path = "crates/trigger-hub" }
trigger-fs = { path = "crates/trigger-fs", optional = true }
trigger-git = { path = "crates/trigger-git", optional = true }
trigger-clock = { path = "crates/trigger-clock", optional = true }
trigger-docker = { path = "crates/trigger-docker", optional = true }
trigger-github = { path = "crates/trigger-github", optional = true }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
sysinfo = "0.39"
trash = "5"
notify = "8"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
globset = { workspace = true }
regex = { workspace = true }
# Cloud API client (src/cloud). generated.rs needs these; keep progenitor-client
# on the version tools/api-codegen generates with.
progenitor-client = "=0.15.0"
reqwest = { version = "0.13", features = ["json"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Native window glass for the Glass theme (src/glass.rs), and the full screen
# traffic lights (src/traffic_lights.rs).
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
