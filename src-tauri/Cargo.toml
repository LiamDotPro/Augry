[package]
name = "terminal-grid"
version = "0.5.0"
description = "Terminal grid with git labels, worktree view and markdown notes"
edition = "2021"

[lib]
name = "terminal_grid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
sysinfo = "0.39"
trash = "5"
notify = "8"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
# Cloud API client (src/cloud). generated.rs needs these; keep progenitor-client
# on the version tools/api-codegen generates with.
progenitor-client = "=0.15.0"
reqwest = { version = "0.13", features = ["json"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Native window glass for the Glass theme (src/glass.rs), and the full screen
# traffic lights (src/traffic_lights.rs).
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
